              exit 1
            fi
          done

          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_ARCHIVE="hostinger-release-${RELEASE_ID}.tar.gz"
