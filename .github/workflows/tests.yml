      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: bcmath, curl, dom, fileinfo, gd, gmp, intl, mbstring, pdo_mysql, xml, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build production release
        run: |
          set -euo pipefail
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          npm run build
          git archive --format=tar --output=release.tar HEAD
          tar -rf release.tar vendor public bootstrap/cache
          for path in resources/js/actions resources/js/routes resources/js/wayfinder; do
            if [ -d "$path" ]; then
              tar -rf release.tar "$path"
            fi
          done
          gzip release.tar

      - name: Configure SSH
        env:
          HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ "$HOSTINGER_SSH_PORT" = 22 ]; then
            HOSTINGER_ENDPOINT="$HOSTINGER_HOST"
          else
            HOSTINGER_ENDPOINT="[$HOSTINGER_HOST]:$HOSTINGER_SSH_PORT"
          fi
          if ssh-keygen -F "$HOSTINGER_ENDPOINT" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            HOSTINGER_HOST_KEY_ALIAS="$HOSTINGER_ENDPOINT"
          elif ssh-keygen -F "$HOSTINGER_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            HOSTINGER_HOST_KEY_ALIAS="$HOSTINGER_HOST"
          else
            echo "::error::HOSTINGER_KNOWN_HOSTS must pin $HOSTINGER_ENDPOINT or the bare HOSTINGER_HOST."
            exit 1
          fi
          printf 'HOSTINGER_HOST_KEY_ALIAS=%s\n' "$HOSTINGER_HOST_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Upload and activate release
        env:
          HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_APP_PATH: ${{ vars.HOSTINGER_APP_PATH }}
          HOSTINGER_PUBLIC_PATH: ${{ vars.HOSTINGER_PUBLIC_PATH }}
