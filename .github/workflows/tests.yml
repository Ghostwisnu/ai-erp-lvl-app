          case "$PUBLIC_PATH/" in "$APP_PATH/"*) echo "Public directory must be outside the application path." >&2; exit 1 ;; esac
          test "$APP_PATH" != "$PUBLIC_PATH"
          test -f "$APP_PATH/shared/.env" || { echo "Missing $APP_PATH/shared/.env; create the production .env file first." >&2; exit 1; }
          if [ -e "$PUBLIC_PATH/storage" ] && [ ! -L "$PUBLIC_PATH/storage" ]; then
